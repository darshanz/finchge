site_name: finchGE
repo_url: https://github.com/finchGE/finchge
repo_name: finchge/finchge
extra:
  version:
    provider: mike
theme:
  name: material
  features:
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - toc.follow
    - navigation.top
  logo: assets/images/finchge_white.png
  favicon: assets/images/finchge_white.ico
  palette:
    primary: blue
    accent: indigo
nav:
  - Introduction: index.md
  - Core Concepts:
      - Grammatical Evolution: grammatical_evolution.md
      - Grammar and Mapping: grammar.md
      - Fitness and Populations: fitness_and_populations.md
      - Operators: operators.md
      - Algorithms: algorithms.md
      - Configuration: configuration.md
      - Experiment Utilities: experiment_utilities.md
      - Symbolic Regression: symbolic_regression.md
      - Benchmarks: benchmarks.md
  - Installation: installation.md
  - Getting Started: getting_started.md
  - Examples: examples.md
  - API Reference: api.md
  - License: license_info.md
  - Contributing: contributing.md
  - Changelog: changelog.md
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
        - pymdownx.tabbed:
        - alternate_style: true
  - toc:
      toc_depth: 3
  - pymdownx.highlight:
      use_pygments: true
      pygments_style: material
      linenums: false
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
        generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
