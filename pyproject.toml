[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "finchge"
version = "1.0.1-beta.8"
description = "FinchGE is a grammatical evolution library."
authors = [
    {name = "Sudarshan Pant", email = "sudarshan.pant@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE*"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tqdm>=4.67.1",
    "diskcache>=5.6.3",
    "requests>=2.32.5",
    "tabulate>=0.9.0",
    "matplotlib>=3.7.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.7",
    "typer>=0.21.1",
    "PyYAML>=6.0",
    "cloudpickle>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0",
    "flake8>=6.0",
    "isort>=5.12",
    "pre-commit>=3.0.0",
    "pytest>=7.0",
    "mypy>=1.0",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=0.21.0",
    "markdown-katex",
    "pandas-stubs",
    "types-tqdm",
    "types-tabulate",
    "black[jupyter]",
]

test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
]

pytorch = [
    "torch>=2.8.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=0.21.0",
]

# Black configuration
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy configuration (optional)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
exclude = [
  "^tests/",
  "cli/"
]


[project.scripts]
finchge = "finchge.cli.main:main"



[project.urls]
Homepage = "https://github.com/finchge/finchge"
Documentation = "https://finchge.readthedocs.io"
Repository = "https://github.com/finchge/finchge"
"Bug Reports" = "https://github.com/finchge/finchge/issues"
